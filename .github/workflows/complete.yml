name: deploying the dev2-infisuite complete application
on:
  push:
    branches: main
    
permissions:
  contents: read
  actions: read
  
jobs:
  code-build-test-deploy:
    name: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
        
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.javascript.node.maxspace=4096
            -Dsonar.projectKey=infisuite-php-main-branch
            -Dsonar.projectName=infisuite-php-main-branch
            -Dsonar.sources=.
            -Dsonar.exclusions=vendor/**,dompdf/**,phpqrcode/**,htmltopdfconverterTCPDF/**,assets/**,captcha/css/**,captcha/fonts/**,captcha/images/**,model/SMTP/**,scratch/**,**/*.min.js,**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.map,Dockerfile
            -Dsonar.php.coverage.reportPaths=coverage/coverage.xml
            
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Run Trivy FS Scan (TXT)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          format: table
          output: infisuite-php-complete-fs.txt
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy TXT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-txt-report
          path: infisuite-php-complete-fs.txt
          retention-days: 1

      # - name: Fail workflow if Trivy found vulnerabilities
      #   if: steps.trivy.outcome == 'failure'
      #   run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private
          
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dev2-infisuite-complete
        run: |
          docker build --no-cache -t $ECR_REGISTRY/$ECR_REPOSITORY:${SHORT_SHA} .
      
      - name: Trivy image scan (TXT)
        uses: aquasecurity/trivy-action@master
        id: trivy-2
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/dev2-infisuite-complete:${{ env.SHORT_SHA }}
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          output: dev2-infisuite-complete-image.txt
          severity: HIGH,CRITICAL,MEDIUM
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "1"
        
      - name: Upload Trivy TXT Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: |
             dev2-infisuite-complete-image.txt

      # - name: Fail workflow if Trivy found vulnerabilities
      #   if: steps.trivy-2.outcome == 'failure'
      #   run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      
      - name: Login to Amazon ECR
        id: login-ecr-2
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private
          
      - name: image push
        env:
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/dev2-infisuite-complete:${{ env.SHORT_SHA }}
        run: |
          docker push "$IMAGE_REF"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            AWS_REGION=ap-south-1
            ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

            aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

            # image tag changing
            cd /home/ubuntu/applications/dev_infisuite
            sed -E -i "s/(^[[:blank:]]*image.*dev2-infisuite-complete:)(.*)/\1${{ env.SHORT_SHA }}/" docker-compose.yml || echo 'image tag not changed'
            docker compose pull dev2_infisuite
            docker compose up -d --force-recreate dev2_infisuite
