# HTTP: serve the app directly (no redirect)
<VirtualHost *:80>
    ServerName dev2.digixlabs.cloud
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# HTTPS (unchanged)
<VirtualHost *:443>
    ServerName dev2.digixlabs.cloud

    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dev2.digixlabs.cloud/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2.digixlabs.cloud/privkey.pem

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
